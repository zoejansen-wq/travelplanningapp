name: Catalog integrity
on:
  push:
    paths:
      - 'index.html'
      - 'collections.json'
      - 'scripts/check-catalog.mjs'
      - '.github/workflows/catalog-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-catalog.mjs
