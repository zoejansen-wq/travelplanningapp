name: Golden city before-after screenshots
on:
  pull_request:
    paths:
      - 'index.html'
      - 'golden-city.css'
      - 'destination-stage.js'
      - 'tests/capture-golden-city.cjs'
      - '.github/workflows/golden-city-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: before
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - run: node after/tests/capture-golden-city.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-city-before-after-viewports
          path: screenshots/
          retention-days: 30
