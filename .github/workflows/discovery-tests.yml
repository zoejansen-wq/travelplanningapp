name: Discovery engine tests
on:
  push:
    paths:
      - 'scripts/discover.py'
      - 'discovery/config.json'
      - 'tests/test_discovery.py'
      - '.github/workflows/discovery-tests.yml'
  pull_request:
    paths:
      - 'scripts/discover.py'
      - 'discovery/config.json'
      - 'tests/test_discovery.py'
      - '.github/workflows/discovery-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/discover.py tests/test_discovery.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
